name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh the /stats numbers every day (UTC). Make this more frequent once
  # there is traffic worth watching; each run is a full build and deploy.
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The one-day decks are built from the session decks. If a session deck
      # changed without a rebuild, stop here: run `just one-day-decks`.
      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Check one-day decks are up to date
        run: uv run -q tools/one_day_decks.py --check

      # Writes site/public/stats.json for the /stats page. Never fails the build:
      # with no token or an API outage it keeps the last published numbers.
      - name: Fetch GoatCounter stats
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: uv run -q tools/goatcounter_stats.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm install --prefix site

      - name: Build site
        run: npm run build --prefix site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
